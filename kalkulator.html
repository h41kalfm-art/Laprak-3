<div class="container">

    <div class="card">

        <h1>Kalkulator Nilai Semester</h1>

        <div class="bobot">

            <div class="item-bobot">
                <small>TUGAS</small>
                <span>30%</span>
            </div>

            <div class="item-bobot">
                <small>UTS</small>
                <span>30%</span>
            </div>

            <div class="item-bobot">
                <small>UAS</small>
                <span>40%</span>
            </div>

        </div>

        <label for="tugas">Nilai Tugas</label>
        <input type="number" id="tugas" placeholder="Contoh : 85">

        <label for="uts">Nilai UTS</label>
        <input type="number" id="uts" placeholder="Contoh : 80">

        <label for="uas">Nilai UAS</label>
        <input type="number" id="uas" placeholder="Contoh : 90">

        <button id="btnHitung">
            Hitung Nilai
        </button>

        <div id="error" class="error"></div>

        <div id="hasil" class="hasil">

            <h2>Hasil Perhitungan</h2>

            <div class="nilai-box">
                <h1 id="nilaiAkhir"></h1>
                <h2 id="grade"></h2>
            </div>

        </div>

    </div>

</div>

<script src="kalkulator.js"></script>
